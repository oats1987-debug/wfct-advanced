<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wonderous FC Tales Challenges</title>
  <style>
    :root {
      --ink: #fff8e7;
      --muted: rgba(255, 248, 231, .72);
      --glass: rgba(12, 18, 24, .72);
      --line: rgba(255, 248, 231, .24);
      --gold: #ffd56a;
      --blue: #7ddfff;
      --green: #a9ff8f;
      --shadow: 0 26px 70px rgba(0, 0, 0, .48);
      --radius: 28px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: #091014; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 216, 105, .28), transparent 25rem),
        linear-gradient(180deg, rgba(4, 8, 12, .38), rgba(4, 8, 12, .9)),
        url("F95kIyFJBfnXUKrHOXWKssgA5Q.jpg") center top / cover fixed;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }

    body::before {
      background:
        linear-gradient(90deg, rgba(9, 16, 20, .88), transparent 21%, transparent 79%, rgba(9, 16, 20, .88)),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, .04) 0 1px, transparent 1px 14px);
      mix-blend-mode: screen;
    }

    body::after { background: radial-gradient(circle at 50% 50%, transparent 0 48%, rgba(2, 4, 7, .68) 100%); }
    input { font: inherit; }

    .page {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 46px 0 72px;
    }

    .panel,
    .challenge {
      border: 1px solid rgba(255, 255, 255, .18);
      background:
        linear-gradient(135deg, rgba(255, 213, 106, .14), transparent 36%),
        linear-gradient(180deg, rgba(8, 12, 18, .78), rgba(8, 12, 18, .56));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(140%);
      animation: rise-in 700ms ease both;
    }

    .panel {
      padding: clamp(22px, 4vw, 42px);
      border-radius: var(--radius);
    }

    .eyebrow {
      display: inline-flex;
      margin: 0 0 16px;
      padding: 9px 14px;
      border: 1px solid rgba(255, 213, 106, .42);
      border-radius: 999px;
      color: var(--gold);
      background: rgba(255, 213, 106, .1);
      font: 700 .78rem/1 "Trebuchet MS", Verdana, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 7vw, 6rem);
      line-height: .9;
      letter-spacing: -.07em;
      text-wrap: balance;
      text-shadow: 0 8px 34px rgba(0, 0, 0, .5);
    }

    h2,
    h3,
    .note,
    .message,
    .field,
    .meta,
    .names,
    .empty {
      font-family: "Trebuchet MS", Verdana, sans-serif;
    }

    .note,
    .message {
      color: var(--muted);
      line-height: 1.55;
    }

    .note {
      max-width: 820px;
      margin: 18px 0 0;
      font-size: clamp(1rem, 2vw, 1.12rem);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-top: 24px;
    }

    .field {
      display: grid;
      gap: 8px;
      color: var(--gold);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 18px;
      outline: 0;
      padding: 16px 18px;
      color: var(--ink);
      background: rgba(9, 16, 20, .72);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }

    .count {
      min-height: 54px;
      display: inline-grid;
      place-items: center;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--gold);
      background: rgba(255, 255, 255, .06);
      font: 900 .82rem/1 "Trebuchet MS", Verdana, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .message {
      margin: 16px 0 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(9, 16, 20, .54);
    }

    .challenge-list {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .challenge {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) minmax(220px, .48fr);
      gap: 18px;
      align-items: start;
      padding: 18px;
      border-radius: 18px;
    }

    .number {
      display: grid;
      place-items: center;
      min-height: 72px;
      border: 1px solid rgba(255, 213, 106, .4);
      border-radius: 16px;
      color: #181108;
      background:
        radial-gradient(circle at 30% 25%, #fff9c7, transparent 34%),
        linear-gradient(135deg, #ffe28b, #d88920);
      font: 900 1.35rem/1 "Trebuchet MS", Verdana, sans-serif;
    }

    .challenge h2 {
      margin: 0 0 10px;
      font-size: 1.04rem;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .meta {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.45;
    }

    .meta strong {
      color: var(--blue);
      font-size: .78rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .names {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      align-content: start;
    }

    .name,
    .empty {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: .84rem;
      font-weight: 900;
      line-height: 1;
    }

    .name {
      border: 1px solid rgba(169, 255, 143, .46);
      color: var(--ink);
      background: rgba(169, 255, 143, .1);
    }

    .empty {
      border: 1px solid rgba(255, 248, 231, .18);
      color: var(--muted);
      background: rgba(255, 255, 255, .06);
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .hidden { display: none !important; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 840px) {
      body { background-attachment: scroll; }
      .controls,
      .challenge {
        grid-template-columns: 1fr;
      }
      .names { justify-content: flex-start; }
      .number {
        width: 92px;
        min-height: 56px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <p class="eyebrow">Challenge Companion</p>
      <h1>Wonderous FC Tales Challenges</h1>
      <p class="note">Every challenge from the shared sheet, with the players who currently have it on their bingo cards.</p>
      <div class="controls">
        <label class="field">
          Search challenges or players
          <input id="searchInput" type="search" autocomplete="off" placeholder="Challenge number, text, or player name">
        </label>
        <div id="countLabel" class="count">Loading</div>
      </div>
      <p id="message" class="message" role="status">Loading challenge assignments...</p>
    </section>

    <section id="challengeList" class="challenge-list" aria-live="polite"></section>
  </main>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1_yIPH7Ly8-oYcWlU4EonsbJSVgMtEZXcYo24xPi6_04/export?format=csv&gid=0";
    const REMOTE_SAVE_ENDPOINT = "https://script.google.com/macros/s/AKfycbwwnRAozSexZI_g65iSbVgIoXnsmTXy2ql6y_aFEN3e7hqvCYsq6cMUgAJktNtNacY6/exec";

    const searchInput = document.querySelector("#searchInput");
    const countLabel = document.querySelector("#countLabel");
    const message = document.querySelector("#message");
    const challengeList = document.querySelector("#challengeList");
    let challenges = [];
    let assignments = {};
    let assignmentWarning = "";

    function escapeHTML(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[char]));
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];
        if (char === "\"" && quoted && next === "\"") {
          cell += "\"";
          i += 1;
        } else if (char === "\"") {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(cell.trim());
          cell = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i += 1;
          row.push(cell.trim());
          if (row.some(Boolean)) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }
      row.push(cell.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }

    function normalizeRows(rows) {
      const body = rows[0] && /normal|challenge|power/i.test(rows[0].join(" ")) ? rows.slice(1) : rows;
      return body.filter((row) => row.some(Boolean)).map((row, index) => ({
        number: index + 1,
        normal: row[0] || "",
        powerOne: row[1] || "",
        powerTwo: row[2] || ""
      }));
    }

    function jsonpRemote(params) {
      return new Promise((resolve, reject) => {
        const callbackName = `wfctAssignments_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error("Assignment request timed out."));
        }, 10000);

        function cleanup() {
          window.clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        const url = new URL(REMOTE_SAVE_ENDPOINT);
        Object.entries({ ...params, callback: callbackName }).forEach(([key, value]) => {
          url.searchParams.set(key, value);
        });
        script.onerror = () => {
          cleanup();
          reject(new Error("Assignment request failed."));
        };
        script.src = url.toString();
        document.body.append(script);
      });
    }

    function powerText(challenge) {
      return [challenge.powerOne, challenge.powerTwo].filter(Boolean).join(" + ") || "No power-up listed.";
    }

    function challengeMatches(challenge, query) {
      if (!query) return true;
      const names = assignments[String(challenge.number)] || [];
      const haystack = [
        challenge.number,
        challenge.normal,
        challenge.powerOne,
        challenge.powerTwo,
        names.join(" ")
      ].join(" ").toLowerCase();
      return haystack.includes(query);
    }

    function renderChallenges() {
      const query = searchInput.value.trim().toLowerCase();
      const visible = challenges.filter((challenge) => challengeMatches(challenge, query));
      countLabel.textContent = `${visible.length}/${challenges.length}`;

      if (!visible.length) {
        challengeList.innerHTML = "";
        message.textContent = "No challenges match that search.";
        return;
      }

      const assignedCount = challenges.filter((challenge) => (assignments[String(challenge.number)] || []).length).length;
      message.textContent = assignmentWarning
        ? assignmentWarning
        : `Showing ${visible.length} challenge${visible.length === 1 ? "" : "s"}. ${assignedCount} have at least one player assigned.`;
      challengeList.innerHTML = visible.map((challenge) => renderChallenge(challenge)).join("");
    }

    function renderChallenge(challenge) {
      const names = assignments[String(challenge.number)] || [];
      return `
        <article class="challenge">
          <div class="number">#${challenge.number}</div>
          <div>
            <h2>${escapeHTML(challenge.normal || "Challenge coming soon.")}</h2>
            <div class="meta"><strong>Power-Up</strong><span>${escapeHTML(powerText(challenge))}</span></div>
          </div>
          <div class="names" aria-label="Players assigned to challenge ${challenge.number}">
            ${names.length
              ? names.map((name) => `<span class="name">${escapeHTML(name)}</span>`).join("")
              : `<span class="empty">None</span>`}
          </div>
        </article>
      `;
    }

    async function loadChallenges() {
      const response = await fetch(SHEET_CSV_URL);
      if (!response.ok) throw new Error("Challenge sheet could not be loaded.");
      challenges = normalizeRows(parseCSV(await response.text()));
    }

    async function loadAssignments() {
      const data = await jsonpRemote({ action: "assignments" });
      if (!data.ok) throw new Error(data.error || "Challenge assignments could not be loaded.");
      assignments = data.assignments || {};
    }

    async function init() {
      try {
        await loadChallenges();
        try {
          await loadAssignments();
        } catch (error) {
          console.warn(error);
          assignmentWarning = "Challenges loaded, but saved player assignments are unavailable right now.";
        }
        renderChallenges();
      } catch (error) {
        console.warn(error);
        message.textContent = error.message;
        countLabel.textContent = "Unavailable";
      }
    }

    searchInput.addEventListener("input", renderChallenges);
    init();
  </script>
</body>
</html>
